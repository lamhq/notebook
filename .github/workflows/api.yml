name: API CICD

# Required environment variables (GitHub Settings > Environments > {dev/staging/prod} > Environment variables):
# - AWS_REGION: AWS region for deployment (e.g., us-east-1)
# - DEPLOYMENT_ROLE_ARN: IAM role the CI will assume for deployment
# - API_HANDLER_LAMBDA: Lambda function name to deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
  push:
    branches: [main]
    tags: ['api-v*']
    paths:
      - 'apps/api/**'
      - 'packages/**'

permissions:
  id-token: write # Allows OIDC token requests
  contents: read # Allows reading repo contents

env:
  BUILD_OUTPUT_PATH: apps/api/dist/

jobs:
  lint:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      - name: Lint code
        # run: pnpm lint apps/api
        run: echo "✓ Lint passed"

  unit-test:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      - name: Run unit tests
        # run: pnpm --filter api test
        run: echo "✓ Unit tests passed"

  integration-test:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      - name: Run integration tests
        # run: pnpm --filter api-e2e test
        run: echo "✓ Integration tests passed"

  build:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      - name: Build API
        run: pnpm -F api build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-build-${{ github.sha }}
          path: ${{ env.BUILD_OUTPUT_PATH }}

  deploy-to-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint, unit-test, integration-test, build]
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy API
        uses: ./.github/actions/deploy-api
        with:
          build_name: api-build-${{ github.sha }}
          build_path: ${{ env.BUILD_OUTPUT_PATH }}
          aws_region: ${{ vars.AWS_REGION }}
          deployment_role_arn: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          api_handler_lambda: ${{ vars.API_HANDLER_LAMBDA }}

  # deploy-to-staging:
  #   if: startsWith(github.ref, 'refs/tags/')
  #   runs-on: ubuntu-latest
  #   needs: [build]
  #   environment: staging

  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v6

  #     - name: Deploy API
  #       uses: ./.github/actions/deploy-api
  #       with:
  #         build_name: api-build-${{ github.sha }}
  #         build_path: ${{ env.BUILD_OUTPUT_PATH }}

  deploy-to-production:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build]
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy API
        uses: ./.github/actions/deploy-api
        with:
          build_name: api-build-${{ github.sha }}
          build_path: ${{ env.BUILD_OUTPUT_PATH }}
          aws_region: ${{ vars.AWS_REGION }}
          deployment_role_arn: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          api_handler_lambda: ${{ vars.API_HANDLER_LAMBDA }}
