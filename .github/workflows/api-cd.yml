name: Deploy API

# Required CI Variables (GitHub Settings > Environments > {dev/prod} > Environment variables):
# - AWS_REGION: AWS region for deployment (e.g., us-east-1)
# - DEPLOYMENT_ROLE_ARN: IAM role the CI will assume for deployment
# - API_HANDLER_LAMBDA: Lambda function name to deploy

env:
  BUILD_OUTPUT_PATH: apps/api/dist/

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'

permissions:
  id-token: write # Allows OIDC token requests
  contents: read # Allows reading repo contents

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env

      - name: Build API
        working-directory: apps/api
        run: pnpm -F api build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: ${{ env.BUILD_OUTPUT_PATH }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-build
          path: ${{ env.BUILD_OUTPUT_PATH }}

      - name: Create Lambda deployment package
        run: |
          cd ${{ env.BUILD_OUTPUT_PATH }} && zip -r ../../../api.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.API_HANDLER_LAMBDA }} \
            --zip-file fileb://api.zip \
            --region ${{ vars.AWS_REGION }}

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ vars.API_HANDLER_LAMBDA }} \
            --region ${{ vars.AWS_REGION }}

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: api-build
          path: ${{ env.BUILD_OUTPUT_PATH }}

      - name: Create Lambda deployment package
        run: |
          cd ${{ env.BUILD_OUTPUT_PATH }} && zip -r ../../../api.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.API_HANDLER_LAMBDA }} \
            --zip-file fileb://api.zip \
            --region ${{ vars.AWS_REGION }}

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ vars.API_HANDLER_LAMBDA }} \
            --region ${{ vars.AWS_REGION }}
