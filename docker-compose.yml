services:
  mongodb:
    image: mongo:4.2
    container_name: mongodb
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: test
    volumes:
      - app_data:/data/db
      - ./apps/mongodb:/docker-entrypoint-initdb.d

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    container_name: keycloak
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./apps/keycloak:/opt/keycloak/data/import

  kong:
    image: '${GW_IMAGE:-kong/kong-gateway:3.13.0.2}'
    container_name: kong-gateway
    ports:
      - '8000:8000'
      - '8443:8443'
      - '8001:8001'
      - '8444:8444'
      - '8002:8002'
      - '8445:8445'
    environment:
      KONG_PREFIX: /var/run/kong
      KONG_DATABASE: off
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
    volumes:
      - ./apps/kong/declarative:/kong/declarative/
      - ./apps/kong/tmp:/tmp
      - ./apps/kong/prefix:/var/run/kong

volumes:
  app_data:
  keycloak_data:
