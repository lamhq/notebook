version: '3.8'

services:
  mongodb:
    image: mongo:4.2
    container_name: mongodb
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: test
    volumes:
      - app_data:/data/db
      - ./apps/api/seed:/docker-entrypoint-initdb.d

volumes:
  app_data:
